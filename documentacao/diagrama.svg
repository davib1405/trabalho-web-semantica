<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="950" height="650">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e3c72; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-docente { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 8; }
      .box-discente { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .box-unidade { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .box-projeto { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; rx: 8; }
      .box-lod { fill: #ffe4e6; stroke: #e11d48; stroke-width: 2; rx: 8; stroke-dasharray: 4 2; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .text-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #334155; }
      .edge { stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-lod { stroke: #e11d48; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arrow-lod); }
      .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; background: #fff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-lod" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect width="950" height="650" fill="#f8fafc" />
  
  <text x="40" y="40" class="title">Ontologia de Perfis Acadêmicos — Grafo Conceitual &amp; LOD</text>
  <text x="40" y="60" class="subtitle">UFRRJ &bull; Web Semântica &bull; David Barros da Rosa Filho</text>

  <!-- UNIDADE: ICE -->
  <g transform="translate(370, 90)">
    <rect width="210" height="70" class="box-unidade"/>
    <text x="105" y="30" text-anchor="middle" class="text-title">Instituto de Ciências Exatas</text>
    <text x="105" y="48" text-anchor="middle" class="text-desc">:Instituto &bull; ufrrj:ICE</text>
  </g>

  <!-- DEPTO COMPUTACAO -->
  <g transform="translate(140, 200)">
    <rect width="200" height="65" class="box-unidade"/>
    <text x="100" y="28" text-anchor="middle" class="text-title">Depto de Computação</text>
    <text x="100" y="46" text-anchor="middle" class="text-desc">:Departamento</text>
  </g>

  <!-- CURSO BSI -->
  <g transform="translate(610, 200)">
    <rect width="200" height="65" class="box-unidade"/>
    <text x="100" y="28" text-anchor="middle" class="text-title">Curso Sist. Informação</text>
    <text x="100" y="46" text-anchor="middle" class="text-desc">:Curso</text>
  </g>

  <!-- DOCENTES -->
  <g transform="translate(50, 320)">
    <rect width="180" height="70" class="box-docente"/>
    <text x="90" y="28" text-anchor="middle" class="text-title">Dra. Ana Silva</text>
    <text x="90" y="48" text-anchor="middle" class="text-desc">:Docente (Associada)</text>
  </g>

  <g transform="translate(260, 320)">
    <rect width="180" height="70" class="box-docente"/>
    <text x="90" y="28" text-anchor="middle" class="text-title">Dra. Mariana Almeida</text>
    <text x="90" y="48" text-anchor="middle" class="text-desc">:Docente (Adjunta)</text>
  </g>

  <!-- DISCENTES -->
  <g transform="translate(520, 320)">
    <rect width="170" height="70" class="box-discente"/>
    <text x="85" y="28" text-anchor="middle" class="text-title">João Pereira</text>
    <text x="85" y="48" text-anchor="middle" class="text-desc">:Discente (5º período)</text>
  </g>

  <g transform="translate(720, 320)">
    <rect width="170" height="70" class="box-discente"/>
    <text x="85" y="28" text-anchor="middle" class="text-title">Lucas Ferreira</text>
    <text x="85" y="48" text-anchor="middle" class="text-desc">:Discente (7º período)</text>
  </g>

  <!-- PROJETO -->
  <g transform="translate(360, 440)">
    <rect width="230" height="70" class="box-projeto"/>
    <text x="115" y="28" text-anchor="middle" class="text-title">Proj. Dados Abertos</text>
    <text x="115" y="48" text-anchor="middle" class="text-desc">:ProjetoPesquisa</text>
  </g>

  <!-- LOD EXTERNO -->
  <g transform="translate(700, 85)">
    <rect width="210" height="75" class="box-lod"/>
    <text x="105" y="26" text-anchor="middle" class="text-title" fill="#be123c">Wikidata &amp; DBpedia</text>
    <text x="105" y="44" text-anchor="middle" class="text-desc">Q3550293 (UFRRJ)</text>
    <text x="105" y="58" text-anchor="middle" class="text-desc">Q1002058 (Seropédica)</text>
  </g>

  <!-- SETAS E LIGACOES -->
  <!-- Depto e Curso para ICE -->
  <line x1="240" y1="200" x2="390" y2="160" class="edge" />
  <text x="280" y="175" class="edge-label">:vinculadoA</text>

  <line x1="710" y1="200" x2="560" y2="160" class="edge" />
  <text x="610" y="175" class="edge-label">:vinculadoA</text>

  <!-- Docentes para Depto -->
  <line x1="140" y1="320" x2="200" y2="265" class="edge" />
  <line x1="330" y1="320" x2="270" y2="265" class="edge" />

  <!-- Discentes para Curso -->
  <line x1="620" y1="320" x2="680" y2="265" class="edge" />
  <line x1="780" y1="320" x2="740" y2="265" class="edge" />

  <!-- Docentes e Discentes para Projeto -->
  <line x1="180" y1="390" x2="360" y2="455" class="edge" />
  <text x="210" y="435" class="edge-label">:coordena</text>

  <line x1="320" y1="390" x2="410" y2="440" class="edge" />
  <text x="330" y="420" class="edge-label">:participaDe</text>

  <line x1="570" y1="390" x2="510" y2="440" class="edge" />
  <text x="545" y="420" class="edge-label">:participaDe</text>

  <line x1="760" y1="390" x2="580" y2="465" class="edge" />
  <text x="660" y="445" class="edge-label">:participaDe</text>

  <!-- Orientação -->
  <line x1="230" y1="355" x2="520" y2="355" class="edge" stroke="#0284c7" stroke-dasharray="3 3"/>
  <text x="370" y="348" class="edge-label">:orienta</text>

  <!-- Conexoes LOD -->
  <line x1="580" y1="120" x2="700" y2="120" class="edge-lod" />
  <text x="605" y="112" class="edge-label" fill="#be123c">owl:sameAs / rdfs:seeAlso</text>

  <text x="40" y="610" class="subtitle">Legenda: [Azul: Docentes] [Verde: Discentes] [Amarelo: Unidades/Cursos] [Roxo: Projetos] [Rosa tracejado: Linked Open Data]</text>
</svg>